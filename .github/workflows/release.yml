name: yayin

# Etiket itildiğinde kurulum paketini ve saha testi paketini üretip GitHub Release
# olarak yayınlar. Elle üretim bırakıldı, çünkü elle üretilen bir pakette hangi
# commit'ten, hangi upstream sürümünden ve hangi ayarlarla çıktığı kaybolabiliyor.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Surum (tag olmadan deneme uretimi icin, or. 0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    # Gerekçesi installer-test.yml'de. Yayın akışında asılı kalmak ayrıca kötü:
    # etiket atılmış, taslak yok ve sebebi görünmüyor.
    # 30 dk, ölçülen süreden (~7 dk 30 sn) yaklaşık 4 kat büyük.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Sürüm TEK kaynaktan: etiket. Hem exe'nin sürüm bilgisine hem kurulum
      # paketine aynı değer giriyor, böylece üretilen dosyayla etiket ayrışamıyor.
      - name: surumu belirle
        id: surum
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $env:GITHUB_REF -replace '^refs/tags/v', ''
          } else {
            '${{ github.event.inputs.version }}'
          }
          if (-not $v) { throw 'Surum belirlenemedi.' }
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Surum x.y.z olmali: $v" }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Surum: $v"

      # Yayın notu CHANGELOG'dan üretiliyor. Paketlemeden ÖNCE, çünkü sürüm notu
      # yazılmadıysa on dakikalık üretimi boşa harcamanın anlamı yok.
      - name: yayin notunu uret
        shell: pwsh
        run: >
          pwsh -File tools/release-notes.ps1
          -Version ${{ steps.surum.outputs.version }}
          -OutPath release-notes-generated.md

      - name: upstream ikililerini indir
        run: powershell -ExecutionPolicy Bypass -File tools/fetch-upstream.ps1

      # Yayınlanan pakette test edilmemiş kod olmasın. CI ayrıca koşuyor ama
      # yayın kendi başına ayakta durmalı: etiket doğrudan da itilebiliyor.
      - name: test
        run: dotnet test tests/ZapretTr.Tests -c Release --nologo

      - name: uygulamayi yayinla
        run: >
          dotnet publish src/ZapretTr.App -c Release -o publish/app
          -p:SelfContained=true -p:RuntimeIdentifier=win-x64 -p:DebugType=none
          -p:Version=${{ steps.surum.outputs.version }} --nologo

      # QUIC ölçümü msquic.dll'e bağlı ve yokluğu SESSİZ bir hataya dönüşüyor.
      - name: msquic yayin ciktisinda mi
        shell: pwsh
        run: |
          if (-not (Test-Path publish/app/msquic.dll)) {
            throw "msquic.dll yayin ciktisinda yok. QUIC olcumu sessizce calismaz."
          }

      # Akıllı Uygulama Denetimi imzasız DLL'i ayrı ayrı engelliyor (0.2.0:
      # "Bu uygulamanın bir kısmı engellendi ... ZapretTR.dll"). Yayın tek dosya;
      # imzasız tek PE dosyası exe olmalı. Gerekçesi ZapretTr.App.csproj'da.
      - name: yayinda imzasiz DLL yok
        shell: pwsh
        run: |
          $imzasiz = Get-ChildItem publish/app -Recurse -File -Include *.dll,*.exe |
            Where-Object { $_.Name -ne 'ZapretTR.exe' -and (Get-AuthenticodeSignature $_.FullName).Status -ne 'Valid' }
          if ($imzasiz) { throw "Yayinda imzasiz dosya var: $($imzasiz.Name -join ', ')" }

      - name: Inno Setup kur
        run: choco install innosetup --no-progress -y

      - name: kurulum paketini uret
        shell: pwsh
        run: |
          # Parantezli ortam değişkeni ${env:...} ile yazılmalı; $env:ProgramFiles(x86)
          # PowerShell'de "$env:ProgramFiles" + "(x86)" olarak ayrışır ve yol bozulur.
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "ISCC bulunamadi: $iscc" }
          & $iscc "/DAppVersion=${{ steps.surum.outputs.version }}" installer\setup.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC basarisiz: $LASTEXITCODE" }

      - name: saha testi paketini uret
        run: powershell -ExecutionPolicy Bypass -File tools/build-field-package.ps1

      # İmzasız dağıtım yapıyoruz (kod imzalama sertifikamız yok), dolayısıyla
      # kullanıcının indirdiği dosyayı doğrulayabilmesinin TEK yolu bu özetler.
      - name: SHA256 ozetleri
        shell: pwsh
        run: |
          $files = @(Get-ChildItem installer\Output\*.exe, dist\*.zip -ErrorAction SilentlyContinue)
          if ($files.Count -eq 0) { throw "Yayinlanacak dosya bulunamadi." }
          $lines = foreach ($f in $files) {
            $h = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$h  $($f.Name)"
          }
          $lines | Tee-Object -Variable shown | Out-File SHA256SUMS.txt -Encoding utf8
          $shown

      # Üçüncü taraf action yerine önceden kurulu gh: bu iş ikili yayınlıyor,
      # dolayısıyla güvendiğimiz kod miktarını küçük tutmak bedava bir kazanç.
      # Yayın TASLAK açılıyor: imzasız ikili dağıtılıyor, son bir göz kasıtlı.
      - name: taslak yayin olustur
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = '${{ steps.surum.outputs.version }}'
          $assets = @(Get-ChildItem installer\Output\*.exe, dist\*.zip, SHA256SUMS.txt -ErrorAction SilentlyContinue)
          if ($assets.Count -lt 2) { throw "Beklenen dosyalar eksik: $($assets.Name -join ', ')" }
          gh release create "v$v" @($assets.FullName) `
            --title "ZapretTR $v" `
            --notes-file release-notes-generated.md `
            --draft
          if ($LASTEXITCODE -ne 0) { throw "gh release create basarisiz: $LASTEXITCODE" }
