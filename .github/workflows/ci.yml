name: derle ve test

# Windows'a bağlı bir proje: WPF, WinDivert, yönetici yetkisi. Linux runner'da
# derlenmesi bile mümkün değil, o yüzden tek iş windows-latest üzerinde.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    # Zaman aşımı yoksa GitHub'ın varsayılanı 360 dk ve asılı kalan bir iş
    # günlüğünü HİÇ yayınlamıyor: teşhisi konamayan, 6 saat süren bir hata.
    # 20 dk, ölçülen süreden (~2 dk 10 sn) yaklaşık 9 kat büyük.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Upstream ikilileri SHA256 ile doğrulanarak iniyor. Bu adım testler için
      # de gerekli: arayüz duman testleri vendor/ altındaki winws.exe'yi arıyor
      # ve dosya yoksa görünüm modeli "KURULUM EKSİK" durumunda kalıp iki test
      # düşer. Bu bir kez gerçek bir makinede yaşandı.
      - name: upstream ikililerini indir
        run: powershell -ExecutionPolicy Bypass -File tools/fetch-upstream.ps1

      # winws'in --hostlist-domains= bayrağını GERÇEKTEN kabul ettiği burada
      # doğrulanıyor. Birim testleri yalnızca bizim ürettiğimiz dizgiyi ölçüyor;
      # bayrağın sabitlenmiş upstream ikilisinde geçerli olup olmadığını onlar
      # göremez. Geliştirici makinesinde de koşturulamıyor: winws --dry-run bile
      # yönetici yetkisi istiyor, runner ise zaten yönetici.
      #
      # Bu, issue #1'in düzeltmesinin can damarı: bayrak sessizce geçersiz olsaydı
      # winws açılmaz ve koruma hiç başlamazdı.
      - name: winws hostlist bayragini kabul ediyor mu
        shell: pwsh
        run: |
          $winws = "vendor/zapret-winws/winws.exe"
          if (-not (Test-Path $winws)) { throw "winws.exe yok: $winws" }

          # Uygulamanın ürettiği biçimin aynısı: bölüm başına --hostlist-domains,
          # bölümler --new ile ayrılmış.
          $argv = @(
            '--dry-run',
            '--wf-tcp=80,443',
            '--filter-tcp=80', '--hostlist-domains=discord.com,discord.gg',
            '--dpi-desync=fake,fakedsplit', '--dpi-desync-autottl=2', '--dpi-desync-fooling=md5sig',
            '--new',
            '--filter-tcp=443', '--hostlist-domains=discord.com,discord.gg',
            '--dpi-desync=fake,multisplit', '--dpi-desync-fooling=badseq', '--dpi-desync-split-pos=1,midsld'
          )

          $cikti = & $winws @argv 2>&1 | Out-String
          $kod = $LASTEXITCODE
          Write-Host $cikti

          if ($kod -ne 0) { throw "winws komutu reddetti (kod $kod). Cikti yukarida." }
          Write-Host "winws --hostlist-domains= bayragini kabul etti."

      - name: derle
        run: dotnet build ZapretTr.sln -c Release --nologo

      - name: test
        run: dotnet test tests/ZapretTr.Tests -c Release --nologo --logger "console;verbosity=normal"

      # Kırpılmış yayın ayrı bir hata sınıfını yakalıyor: yansımayla çalışan bir
      # JSON yolu eklenirse kırpma çözümleyicisi IL2026/IL3050 üretir ve proje bunu
      # HATA sayar. Normal derleme bunu göstermez, o yüzden CI'da ayrıca koşuyor.
      - name: kirpilmis yayin (analizor kontrolu)
        run: dotnet publish src/ZapretTr.Prober.Cli -c Release -o publish/cli --nologo

      # msquic.dll tek dosya paketine gömülünce çalışma anında bulunamıyor ve
      # QUIC ölçümü SESSİZCE yapılamaz hâle geliyor. csproj bunu <Error> ile
      # koruyor; burada bir kez daha, çıktı üzerinden doğruluyoruz.
      - name: msquic yayin ciktisinda mi
        shell: pwsh
        run: |
          if (-not (Test-Path publish/cli/msquic.dll)) {
            throw "msquic.dll yayin ciktisinda yok. QUIC olcumu sessizce calismaz."
          }
          Write-Host "msquic.dll yerinde."
