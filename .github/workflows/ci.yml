name: derle ve test

# Windows'a bagli bir proje: WPF, WinDivert, yonetici yetkisi. Linux runner'da
# derlenmesi bile mumkun degil, o yuzden tek is windows-latest uzerinde.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    # Zaman asimi yoksa GitHub'in varsayilani 360 dk ve asili kalan bir is
    # gunlugunu HIC yayinlamiyor: tanisi konamayan, 6 saat suren bir hata.
    # 20 dk, olculen sureden (~2 dk 10 sn) yaklasik 9 kat buyuk.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Upstream ikilileri SHA256 ile dogrulanarak iniyor. Bu adim testler icin
      # de gerekli: arayuz duman testleri vendor/ altindaki winws.exe'yi ariyor
      # ve dosya yoksa gorunum modeli "KURULUM EKSIK" durumunda kalip iki test
      # duser. Bu bir kez gercek bir makinede yasandi.
      - name: upstream ikililerini indir
        run: powershell -ExecutionPolicy Bypass -File tools/fetch-upstream.ps1

      # winws'in --hostlist-domains= bayragini GERCEKTEN kabul ettigi burada
      # dogrulaniyor. Birim testleri yalnizca bizim urettigimiz dizgiyi olcuyor;
      # bayragin sabitlenmis upstream ikilisinde gecerli olup olmadigini onlar
      # goremez. Gelistirici makinesinde de kosturulamiyor: winws --dry-run bile
      # yonetici yetkisi istiyor, runner ise zaten yonetici.
      #
      # Bu, issue #1'in duzeltmesinin can damari: bayrak sessizce gecersiz olsaydi
      # winws acilmaz ve koruma hic baslamazdi.
      - name: winws hostlist bayragini kabul ediyor mu
        shell: pwsh
        run: |
          $winws = "vendor/zapret-winws/winws.exe"
          if (-not (Test-Path $winws)) { throw "winws.exe yok: $winws" }

          # Uygulamanin urettigi bicimin aynisi: bolum basina --hostlist-domains,
          # bolumler --new ile ayrilmis.
          $argv = @(
            '--dry-run',
            '--wf-tcp=80,443',
            '--filter-tcp=80', '--hostlist-domains=discord.com,discord.gg',
            '--dpi-desync=fake,fakedsplit', '--dpi-desync-autottl=2', '--dpi-desync-fooling=md5sig',
            '--new',
            '--filter-tcp=443', '--hostlist-domains=discord.com,discord.gg',
            '--dpi-desync=fake,multisplit', '--dpi-desync-fooling=badseq', '--dpi-desync-split-pos=1,midsld'
          )

          $cikti = & $winws @argv 2>&1 | Out-String
          $kod = $LASTEXITCODE
          Write-Host $cikti

          if ($kod -ne 0) { throw "winws komutu reddetti (kod $kod). Cikti yukarida." }
          Write-Host "winws --hostlist-domains= bayragini kabul etti."

      - name: derle
        run: dotnet build ZapretTr.sln -c Release --nologo

      - name: test
        run: dotnet test tests/ZapretTr.Tests -c Release --nologo --logger "console;verbosity=normal"

      # Kirpilmis yayin ayri bir hata sinifini yakaliyor: yansimayla calisan bir
      # JSON yolu eklenirse kirpma analizoru IL2026/IL3050 uretir ve proje bunu
      # HATA sayar. Normal derleme bunu gostermez, o yuzden CI'da ayrica kosuyor.
      - name: kirpilmis yayin (analizor kontrolu)
        run: dotnet publish src/ZapretTr.Prober.Cli -c Release -o publish/cli --nologo

      # msquic.dll tek dosya paketine gomulunce calisma aninda bulunamiyor ve
      # QUIC olcumu SESSIZCE yapilamaz hale geliyor. csproj bunu <Error> ile
      # koruyor; burada bir kez daha, cikti uzerinden dogruluyoruz.
      - name: msquic yayin ciktisinda mi
        shell: pwsh
        run: |
          if (-not (Test-Path publish/cli/msquic.dll)) {
            throw "msquic.dll yayin ciktisinda yok. QUIC olcumu sessizce calismaz."
          }
          Write-Host "msquic.dll yerinde."
