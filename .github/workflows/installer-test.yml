name: kurulum testi

# Kurulum paketini GERÇEKTEN kurar, servisi kurdurur, üzerine yükseltme yapar ve
# kaldırır. Birim testlerinin göremediği katman bu: 0.1.7 ve 0.1.8'de bulunan ve
# kullanıcıyı etkileyen iki hatanın ikisi de burada yaşıyordu ve 125 birim testinin
# hiçbiri yakalamadı:
#
#   * yükseltme, kurulu otomatik başlatma servisini sessizce siliyordu;
#   * servis kuruluyken "Başlat" ölümcül hata veriyordu.
#
# İkisi de ancak gerçek bir kurulum-yükseltme-kaldırma dizisinde ortaya çıkıyor.
#
# GÜVENLİK: şifreli DNS KAPALI yapılandırılıyor (secureDnsEnabled=false).
# Açık olsaydı servis kurulumu runner'ın sistem DNS'ini 127.0.0.1'e çevirirdi;
# dnscrypt orada cevap vermezse iş ağ erişimini kaybedip asılı kalırdı. DNS
# yolunun kendi testleri ayrı.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kurulum:
    runs-on: windows-latest

    # ÖLÇÜLDÜ (2026-09-15, koşum 35023485144): "üzerine yükseltme kur" adımı
    # asılı kaldı. İş akışında hiçbir zaman aşımı olmadığı için GitHub'ın
    # varsayılanı (360 dk) geçerliydi: koşum 6 saat boyunca asılı kalacaktı ve
    # daha kötüsü, GitHub ÇALIŞAN bir işin günlüğünü vermiyor; yani asılmanın
    # NEREDE olduğunu gösteren kayıt hiç oluşmuyordu. Asılı kalan bir iş sessizce
    # teşhis edilemez olur. Zaman aşımı olunca iş düşer ve günlüğü yayınlanır.
    #
    # 25 dk, ölçülen gerçek süreden (3 dk 16 sn; koşumlar 35020435160,
    # 34950902280, 34948697458) yaklaşık 8 kat büyük: yavaş bir runner'ı
    # düşürmeyecek kadar bol, asılmayı saatlerce beklemeyecek kadar kısa.
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: upstream ikililerini indir
        run: powershell -ExecutionPolicy Bypass -File tools/fetch-upstream.ps1

      - name: uygulamayi yayinla
        run: >
          dotnet publish src/ZapretTr.App -c Release -o publish/app
          -p:SelfContained=true -p:RuntimeIdentifier=win-x64 -p:DebugType=none
          -p:Version=0.0.1-ci --nologo

      # Akıllı Uygulama Denetimi imzasız her DLL'i ayrı ayrı itibara soruyor ve
      # 0.2.0'da "Bu uygulamanın bir kısmı engellendi ... ZapretTR.dll" diyerek
      # uygulamayı çalıştırmadı. Yayın tek dosya; imzasız tek PE dosyası exe olmalı.
      # Tek dosya ayarı kaybolursa (koşul, SDK değişikliği) bunu yalnızca bu görür.
      - name: yayinda imzasiz DLL yok
        shell: pwsh
        run: |
          $imzasiz = Get-ChildItem publish/app -Recurse -File -Include *.dll,*.exe |
            Where-Object { $_.Name -ne 'ZapretTR.exe' -and (Get-AuthenticodeSignature $_.FullName).Status -ne 'Valid' }
          if ($imzasiz) { throw "Yayinda imzasiz dosya var: $($imzasiz.Name -join ', ')" }
          if (-not (Test-Path publish/app/msquic.dll)) { throw "msquic.dll yayin ciktisinda yok." }

      - name: Inno Setup kur
        run: choco install innosetup --no-progress -y

      - name: kurulum paketini uret
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "ISCC bulunamadi: $iscc" }
          & $iscc "/DAppVersion=0.0.1" installer\setup.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC basarisiz: $LASTEXITCODE" }

          $paket = Get-ChildItem installer\Output\*.exe | Select-Object -First 1
          if (-not $paket) { throw "Kurulum paketi uretilmedi." }
          "paket=$($paket.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      # --- 1. Temiz kurulum ---------------------------------------------------
      - name: kur (sessiz)
        shell: pwsh
        run: |
          $p = Start-Process $env:paket -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Kurulum $($p.ExitCode) koduyla dondu." }

      - name: kurulum dogrula
        shell: pwsh
        run: |
          $kok = Join-Path $env:ProgramFiles 'ZapretTR'
          foreach ($yol in @(
              (Join-Path $kok 'ZapretTR.exe'),
              (Join-Path $kok 'zapret-winws\winws.exe'),
              (Join-Path $kok 'profiles'))) {
            if (-not (Test-Path $yol)) { throw "Kurulumdan sonra eksik: $yol" }
          }

          # Programlar listesinde görünmeli; görünmezse kullanıcı kaldıramaz.
          $anahtar = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\{8F3A1C42-5D7E-4B19-9A24-6E8C0F5D3B71}_is1'
          if (-not (Test-Path $anahtar)) { throw "Kaldirma kayit defteri girdisi yok: $anahtar" }

          $kaldirici = (Get-ItemProperty $anahtar).UninstallString -replace '"',''
          if (-not (Test-Path $kaldirici)) { throw "Kaldirici bulunamadi: $kaldirici" }
          "kaldirici=$kaldirici" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

          # Temiz kurulumda servis OLMAMALI: otomatik başlatma kullanıcının
          # açıkça seçtiği bir şey, kurulumun varsayılanı değil.
          # sc.exe çıkış kodunu ADIMIN çıkış koduna sızdırmadan sorar.
          # pwsh -Command son yerel komutun kodunu adımın kodu olarak
          # yansıtıyor; "servis yok" (1060) o yüzden başarısızlık gibi
          # görünüyordu. Kontroller throw ile düşer, çıkış koduyla değil.
          function ServisVar([string]$ad) {
            sc.exe query $ad *> $null
            $sonuc = $LASTEXITCODE -eq 0
            $global:LASTEXITCODE = 0
            return $sonuc
          }

          foreach ($ad in 'ZapretTR','ZapretTR-DNS') {
            if (ServisVar $ad) { throw "$ad servisi temiz kurulumda kurulmus olmamaliydi." }
          }

          # DNS bekçisi her kurulumda kurulmalı: servis modunda sonradan takılan
          # kartı yönlendiren ve ölü çözümleyicide interneti geri getiren tek şey o.
          # Kurulum paketi --register-dns-guard'ın çıkış kodunu kullanıcıya
          # göstermiyor; kaybolursa bunu yalnızca bu kontrol görür.
          $gorev = Get-ScheduledTask -TaskName 'ZapretTR DNS Bekcisi' -ErrorAction SilentlyContinue
          if (-not $gorev) { throw "DNS bekcisi gorevi kurulmadi." }
          $eylem = $gorev.Actions | Select-Object -First 1
          if ($eylem.Arguments -ne '--dns-guard' -or $eylem.Execute -notlike '*\ZapretTR\ZapretTR.exe') {
            throw "DNS bekcisi gorevi yanlis komutu gosteriyor: $($eylem.Execute) $($eylem.Arguments)"
          }

          # Yedek yokken bekçi turu hiçbir şey yapmamalı ve 0 ile bitmeli.
          Start-ScheduledTask -TaskName 'ZapretTR DNS Bekcisi'
          for ($i = 0; $i -lt 60 -and (Get-ScheduledTask -TaskName 'ZapretTR DNS Bekcisi').State -eq 'Running'; $i++) { Start-Sleep -Seconds 1 }
          Start-Sleep -Seconds 2
          $sonuc = (Get-ScheduledTaskInfo -TaskName 'ZapretTR DNS Bekcisi').LastTaskResult
          if ($sonuc -ne 0) { throw "DNS bekcisi turu $sonuc koduyla bitti." }

          exit 0

      # --- 2. Servis kurulumu -------------------------------------------------
      - name: yapilandirma yaz ve servisi kur
        shell: pwsh
        run: |
          # Gerçek bir kullanıcının parametre testinden sonra sahip olduğu duruma
          # eşdeğer yapılandırma. secureDnsEnabled KAPALI; gerekçesi dosyanın
          # başında.
          $dizin = Join-Path $env:ProgramData 'ZapretTR'
          New-Item -ItemType Directory -Force $dizin | Out-Null
          @{
            selectedIspId       = 'turk-telekom'
            selectedStrategyId  = 'tt-443-fake-ttl4'
            selectedStrategyArgs= '--dpi-desync=fake --dpi-desync-ttl=4'
            secureDnsEnabled    = $false
            customTarget        = $null
          } | ConvertTo-Json | Out-File (Join-Path $dizin 'config.json') -Encoding utf8

          $exe = Join-Path $env:ProgramFiles 'ZapretTR\ZapretTR.exe'
          $p = Start-Process $exe -ArgumentList '--install-services' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "--install-services $($p.ExitCode) koduyla dondu." }

      - name: servis kuruldu mu
        shell: pwsh
        run: |
          # sc.exe çıkış kodunu ADIMIN çıkış koduna sızdırmadan sorar.
          # pwsh -Command son yerel komutun kodunu adımın kodu olarak
          # yansıtıyor; "servis yok" (1060) o yüzden başarısızlık gibi
          # görünüyordu. Kontroller throw ile düşer, çıkış koduyla değil.
          function ServisVar([string]$ad) {
            sc.exe query $ad *> $null
            $sonuc = $LASTEXITCODE -eq 0
            $global:LASTEXITCODE = 0
            return $sonuc
          }

          if (-not (ServisVar ZapretTR)) { throw "ZapretTR servisi kurulmadi." }

          # Şifreli DNS kapalıyken DNS servisi kurulmamalı. Kurulduysa
          # yapılandırma dikkate alınmıyor demektir ve sistem DNS'i de
          # çevrilmiş olabilir; CI için de kullanıcı için de kötü.
          if (ServisVar ZapretTR-DNS) { throw "DNS kapaliyken ZapretTR-DNS kurulmus." }

          # winws'i durduruyoruz: testin ölçtüğü şey servisin VARLIĞI, çalışıp
          # çalışmadığı değil. Çalışır durumda bırakmak runner'ın kendi 80/443
          # trafiğini gereksiz yere kurcalar.
          sc.exe stop ZapretTR *> $null
          Start-Sleep -Seconds 3

          exit 0

      # --- 3. Asıl sınav: yükseltme servisi koruyor mu -------------------------
      - name: uzerine yukseltme kur
        shell: pwsh
        run: |
          # 0.2.0 ve öncesi çok dosyalıydı. O sürümlerin kalıntısını taklit et:
          # yükseltme bunları silmezse imzasız ZapretTR.dll Program Files'ta kalır.
          $kok = Join-Path $env:ProgramFiles 'ZapretTR'
          New-Item -ItemType Directory -Force (Join-Path $kok 'tr') | Out-Null
          foreach ($f in 'ZapretTR.dll','ZapretTr.Core.dll','ZapretTR.deps.json','tr\PresentationCore.resources.dll') {
            Set-Content (Join-Path $kok $f) 'eski surum kalintisi'
          }

          # -Wait YOK, bilerek. İki sebep:
          #
          # 1) KESİN: -Wait'in bekleme sınırı yok. 2026-09-15'te bu adım (koşum
          #    35023485144) asılı kaldı ve iş akışında zaman aşımı olmadığı için
          #    GitHub günlüğü HİÇ yayınlamadı; yani asılmanın nerede olduğunu
          #    gösteren kayıt da oluşmadı. Elle beklemek, asılmayı kayda düşüren
          #    ve teşhisi konabilen bir hataya çevirir.
          #
          # 2) BİLDİRİLMİŞ ama burada KANITLANMADI: -Wait süreç ağacını bekliyor.
          #    Kurulum o sırada [Run] içinde DNS bekçisini "nowait" ile başlatıyordu
          #    (sonradan [Code]'a taşındı); öyleyse kurulum bitse bile adım o çocuğu
          #    beklemiş olurdu. O koşumun asılma sebebi bu muydu bilmiyorum; elle
          #    beklemek ihtimali kaldırıyor.
          $p = Start-Process $env:paket -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -PassThru
          if (-not $p.WaitForExit(600000)) {
            # Asılı kaldıysa NE beklediğini yaz; bir dahaki sefere tahmin etmeyelim.
            Write-Host '--- calisan surecler ---'
            Get-Process | Where-Object { $_.Name -match 'setup|ZapretTR|winws|dnscrypt|sc$' } |
              Format-Table Id,Name,StartTime -AutoSize | Out-String | Write-Host
            Write-Host '--- servisler ---'
            foreach ($ad in 'ZapretTR','ZapretTR-DNS','windivert','WinDivert14') {
              sc.exe query $ad 2>&1 | Out-String | Write-Host
            }
            $global:LASTEXITCODE = 0
            try { $p.Kill($true) } catch { }
            throw "Yukseltme 10 dakikada bitmedi (olculen normal sure: birkac saniye)."
          }
          if ($p.ExitCode -ne 0) { throw "Yukseltme $($p.ExitCode) koduyla dondu." }

      - name: servis yukseltmeden sag cikti mi
        shell: pwsh
        run: |
          # 0.1.8'de düzeltilen hata: kurulum, dosyaları değiştirebilmek için
          # servisi söküyor ama geri kurmuyordu. Kullanıcı korumasız kalıyordu ve
          # HİÇBİR belirti yoktu; uygulama doğru davranıyordu, kaybolan şey bir
          # kez basılmış bir düğmenin sonucuydu.
          # sc.exe çıkış kodunu ADIMIN çıkış koduna sızdırmadan sorar.
          # pwsh -Command son yerel komutun kodunu adımın kodu olarak
          # yansıtıyor; "servis yok" (1060) o yüzden başarısızlık gibi
          # görünüyordu. Kontroller throw ile düşer, çıkış koduyla değil.
          function ServisVar([string]$ad) {
            sc.exe query $ad *> $null
            $sonuc = $LASTEXITCODE -eq 0
            $global:LASTEXITCODE = 0
            return $sonuc
          }

          if (-not (ServisVar ZapretTR)) {
            throw "REGRESYON: otomatik baslatma servisi yukseltmede kayboldu."
          }

          $kok = Join-Path $env:ProgramFiles 'ZapretTR'
          foreach ($f in 'ZapretTR.dll','ZapretTr.Core.dll','ZapretTR.deps.json','tr') {
            if (Test-Path (Join-Path $kok $f)) { throw "Yukseltme eski surum kalintisini silmedi: $f" }
          }
          # [InstallDelete] kökteki *.dll'i siliyor; güncel yerel DLL'ler geri yazılmalı.
          foreach ($f in 'msquic.dll','wpfgfx_cor3.dll') {
            if (-not (Test-Path (Join-Path $kok $f))) { throw "Yukseltmeden sonra eksik: $f" }
          }

          $baslangic = sc.exe qc ZapretTR | Select-String 'START_TYPE'
          $global:LASTEXITCODE = 0
          if ($baslangic -notmatch 'AUTO_START') {
            throw "REGRESYON: servis var ama otomatik baslatma degil: $baslangic"
          }

          exit 0

      # --- 4. Sökme ve kaldırma -----------------------------------------------
      - name: servisleri sok
        shell: pwsh
        run: |
          $exe = Join-Path $env:ProgramFiles 'ZapretTR\ZapretTR.exe'
          $p = Start-Process $exe -ArgumentList '--uninstall-services' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "--uninstall-services $($p.ExitCode) koduyla dondu." }

          # sc.exe çıkış kodunu ADIMIN çıkış koduna sızdırmadan sorar.
          # pwsh -Command son yerel komutun kodunu adımın kodu olarak
          # yansıtıyor; "servis yok" (1060) o yüzden başarısızlık gibi
          # görünüyordu. Kontroller throw ile düşer, çıkış koduyla değil.
          function ServisVar([string]$ad) {
            sc.exe query $ad *> $null
            $sonuc = $LASTEXITCODE -eq 0
            $global:LASTEXITCODE = 0
            return $sonuc
          }

          if (ServisVar ZapretTR) { throw "ZapretTR servisi sokulmedi." }

          exit 0

      - name: kaldir (sessiz)
        shell: pwsh
        run: |
          $p = Start-Process $env:kaldirici -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Kaldirma $($p.ExitCode) koduyla dondu." }

          # Kaldırıcı arka planda bitiyor olabilir.
          Start-Sleep -Seconds 5

      - name: kaldirma dogrula
        shell: pwsh
        run: |
          $kok = Join-Path $env:ProgramFiles 'ZapretTR'
          if (Test-Path (Join-Path $kok 'ZapretTR.exe')) {
            throw "Kaldirmadan sonra uygulama dosyasi duruyor."
          }

          $anahtar = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\{8F3A1C42-5D7E-4B19-9A24-6E8C0F5D3B71}_is1'
          if (Test-Path $anahtar) { throw "Kaldirmadan sonra kayit defteri girdisi duruyor." }

          # sc.exe çıkış kodunu ADIMIN çıkış koduna sızdırmadan sorar.
          # pwsh -Command son yerel komutun kodunu adımın kodu olarak
          # yansıtıyor; "servis yok" (1060) o yüzden başarısızlık gibi
          # görünüyordu. Kontroller throw ile düşer, çıkış koduyla değil.
          function ServisVar([string]$ad) {
            sc.exe query $ad *> $null
            $sonuc = $LASTEXITCODE -eq 0
            $global:LASTEXITCODE = 0
            return $sonuc
          }

          foreach ($ad in 'ZapretTR','ZapretTR-DNS','windivert','WinDivert14') {
            if (ServisVar $ad) { throw "Kaldirmadan sonra $ad servisi duruyor." }
          }

          # Kalıntı görev, silinmiş bir exe'yi her 10 dakikada çalıştırmaya çalışır.
          if (Get-ScheduledTask -TaskName 'ZapretTR DNS Bekcisi' -ErrorAction SilentlyContinue) {
            throw "Kaldirmadan sonra DNS bekcisi gorevi duruyor."
          }

          exit 0

      # İş hangi adımda düşerse düşsün runner temiz kalmalı; kalıntı bir sürücü
      # ya da servis sonraki koşumları da bozar.
      - name: temizlik
        if: always()
        shell: pwsh
        run: |
          foreach ($ad in 'ZapretTR','ZapretTR-DNS','windivert','WinDivert14','monkey') {
            sc.exe stop $ad *> $null
            sc.exe delete $ad *> $null
          }
          Get-Process winws,dnscrypt-proxy -ErrorAction SilentlyContinue | Stop-Process -Force
          Unregister-ScheduledTask -TaskName 'ZapretTR DNS Bekcisi' -Confirm:$false -ErrorAction SilentlyContinue
          exit 0
